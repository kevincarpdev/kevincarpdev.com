services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - /opt/repos:/repos:ro   # client repos, read-only — chat gets file tree + mentioned files
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the app reach `hermes proxy` on the VPS

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - app
